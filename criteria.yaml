# スクリーニング閾値（変更したらここを編集）
markets: ["グロース", "スタンダード"]   # 対象市場（master の MktNm 部分一致。プライムを含めるなら追加）

# --- ストップ高後の押し目（層A） -------------------------------------------
sh_window: 20                  # S高日を探す直近営業日数。追加APIはこの日数ぶん（土日は問い合わせない）
earnings_skip_bdays: 5         # 「決算跨ぎ除外」フィルタの既定日数（フィルタ自体は既定OFF）
# ▼ B群ゲート: backtest_dip.py の結果が「+5%到達率・平均損益とも無選別ベンチ超え」を
#   満たすまで true にしないこと（依頼書 V0節）。false のあいだ列は出すが既定では絞らない。
dip_default_filter: false
dip_dd_band: [-20.0, -10.0]    # 上を true にしたときだけ使う 高値からの下落率レンジ(%)
dip_dry_max: 30.0              # 上を true にしたときだけ使う 出来高枯れ比 上限(%)

# --- 層B（銘柄カード）で使う閾値・既存キー（後方互換のため削除しない） -------
market_cap_oku_min: 10          # 時価総額 下限(億円)
market_cap_oku_max: 300         # 時価総額 上限(億円)  ※テンバガー標準は 20-100
change_pct_min: 5.0             # （旧・初動版の一次絞り込み。現在は母集団判定に使っていない）
volume_spike_min: 3.0           # 出来高 = 過去20日平均の何倍以上で「急増」（層Bの表示）
op_margin_min: 0.13            # 営業利益率 下限（13%）
equity_ratio_min: 40.0         # 自己資本比率 下限(%)
roe_min: 8.0                   # ROE 下限(%)
ma_avg_window: 20              # 出来高平均の期間（日）
taboo_equity_ratio_max: 30.0   # タブー: 自己資本比率 これ以下
margin_long_k_max: 1000        # 信用買残 これ(千株)以下を「少」とみなす目安
