# manual/_テンプレート — このファイルはテンプレート（ファイル名が銘柄コードでないため読み込まれない）
#
# 使い方: cp manual/_template.yaml manual/1234.yaml して埋める。
#   - ファイル名は **4桁の表示コード**（新形式の英数字コードも可: 296A.yaml / 338A.yaml）。
#     J-Quants の5桁コード(13010)は screener 側で4桁(1301)に畳んでから読む。
#   - 未入力でも層A・層Bは壊れない。埋まっていない項目は「未」「—」で出る。
#   - 値にカンマ・コロン・記号（, : → % 等）を含む場合は必ず "" で囲むこと。
#   - 日付は "2026-10-15" のように引用符付きのISO表記を推奨。
#   - このディレクトリはリポジトリにコミットする（GitHub Actions から読むため）。
#
# 確度の書き分け（本体 kabu-monitor と同じ）:
#   【事実】= 一次情報で確認済み ／ 【推測】= 仮説・解釈 ／ 【要検証】= 未確認
#   コメント行だけで持たず、**実キー**として値を入れること。

# `code` はメモ（ローダーはファイル名だけを見るので、ここを書き換えても読む先は変わらない）
code: "1234"

# ストップ高の材料（2〜3行）。J-Quants非配信なので TDnet/EDINET/かぶれん等で調べて書く。
material: |
  上期経常を上方修正。半導体検査装置の受注が想定超。
  据え置きだった通期も増額。【事実】2026-09-08 適時開示

# 上方修正 / 大型契約・提携 / テーマ連想 / 仕手・材料不明 のいずれか。
# 未入力なら層Aの「材料分類」列は「未」。
material_class: "上方修正"

# 材料の継続性（1行）。一過性か、受注残や契約期間の裏付けがあるか。
continuity: "受注残に裏付けあり。一過性ではない【推測】"

# 次回決算発表日。confirmed: true なら「確定」、false/未記入なら「推定」と表示する。
# /equities/earnings-calendar は翌営業日発表分しか返さないので、ここが主な情報源。
earnings_date: "2026-10-15"
earnings_date_confirmed: false

# 任意。浮動株数（四季報から手入力）。入れると層Bに「信用買残÷浮動株」が出る（10%超で警告色）。
# J-Quants は浮動株を配信しないので、ここが唯一の入力経路。未入力なら行ごと出ない。
float_shares: 12000000

# 任意。自分用のメモ（層Bにそのまま出る）。
note: ""
