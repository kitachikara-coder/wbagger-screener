material: |
  2026-09-02 に独歩高しS高。直近IPO銘柄の需給妙味に加え、TOPIX採用の思惑が買いを集めた【事実】株探 2026-09-02。
  個別の業績材料ではなく需給・思惑が主因。9/4 に急ピッチな上昇の反動でS安まで急反落している【事実】。
  実材料として 2026-09-04 16:30「グローバルサウス未来志向型共創等事業費補助金（大型実証・非ASEAN）」採択を開示、
  サウジでの自動運転バス実証事業【事実】。自動運転OS「Autoware」を開発、トヨタ・スズキが出資。

material_class: "テーマ連想"

continuity: "S高の主因はTOPIX採用思惑＝一過性。補助金採択は実材料だが売上寄与は未開示。2026-09-09に東証が信用取引の臨時措置（規制強化）を実施し需給が悪化、4日続落【事実】"

